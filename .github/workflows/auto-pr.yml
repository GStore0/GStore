name: Auto Create Pull Request

on:
  push:
    branches:
      - 'fix/**'
      - 'feature/**'
      - 'refactor/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    if: github.event.deleted == false
    runs-on: ubuntu-latest

    steps:
      - name: Create PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          open_prs=$(gh pr list --repo "$REPO" --head "$BRANCH" --base master \
            --state open --json number --jq 'length')

          if [ "$open_prs" -gt 0 ]; then
            echo "PR for $BRANCH already exists, skipping."
            exit 0
          fi

          TITLE=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          [ -z "$TITLE" ] && TITLE="$BRANCH"

          BODY="Automatically created from push.

          **Source branch:** \`$BRANCH\`
          **Target branch:** \`master\`"

          gh pr create --repo "$REPO" \
            --head "$BRANCH" --base master \
            --title "$TITLE" --body "$BODY" \
            --assignee "${{ github.actor }}"
