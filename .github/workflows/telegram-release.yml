name: Telegram Release Notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Get Latest Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh release view --json tagName,body,url)

          echo "tag_name=$(echo "$RELEASE" | jq -r '.tagName')" >> "$GITHUB_OUTPUT"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RELEASE" | jq -r '.body' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "url=$(echo "$RELEASE" | jq -r '.url')" >> "$GITHUB_OUTPUT"

      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          MESSAGE=$(cat <<EOF
          🚀 GStore ${TAG_NAME} is officially released!

          We're excited to announce the stable release of GStore!

          ${RELEASE_BODY}

          📦 Download ${TAG_NAME}:
          ${RELEASE_URL}

          💬 Join our community:
          - Telegram Channel: https://t.me/GStore000
          - Telegram Group: https://t.me/GSrore000_chat

          Thank you for supporting GStore. Stay tuned for more updates!

          #GStore #Release #Android
          EOF
          )

          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "disable_web_page_preview=true"
